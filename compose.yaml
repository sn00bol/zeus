services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-zeus}
      POSTGRES_USER: ${DB_USER:-zeus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run python setup.py to generate DB_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - ./database/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" && psql -v ON_ERROR_STOP=1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -c 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12

  zeus:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${ZEUS_IMAGE:-zeus:local}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEBUI_PORT:-3000}:${WEBUI_PORT:-3000}"
    env_file:
      - .env
    environment:
      ZEUS_MANAGED_DATABASE: "true"
      DB_HOST: postgres
      DB_PORT: "5432"
      WEBUI_HOST: "0.0.0.0"
      LLM_HOST: ${ZEUS_LLM_HOST:-host.docker.internal}
      BRIDGE_TOKEN: ${BRIDGE_TOKEN:?Run python setup.py to generate BRIDGE_TOKEN}
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      ENABLE_DOCKER_HEALTHCHECK: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      searxng:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "platform/scripts/healthcheck.js"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  searxng:
    image: ghcr.io/searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Run python setup.py to generate SEARXNG_SECRET}
    ports:
      - "127.0.0.1:${SEARXNG_PORT:-8888}:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ./searxng/limiter.toml:/etc/searxng/limiter.toml:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; request = urllib.request.Request('http://127.0.0.1:8080/', headers={'X-Real-IP': '127.0.0.1'}); urllib.request.urlopen(request, timeout=3)"
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
