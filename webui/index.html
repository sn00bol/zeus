<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <meta name="zeus-boot-id" content="">
    <meta name="zeus-version" content="">
    <title>ZEUS</title>
    <link rel="icon" href="/zeus.ico" sizes="any">
    <link rel="preload" href="/font/Streetsign-Sans.otf" as="font" type="font/otf" crossorigin>
    <script>
        (() => {
            let theme = 'system';
            const colors = {};
            try {
                theme = localStorage.getItem('zeus.webui.theme') || 'system';
                if (theme === 'zeus') {
                    theme = 'system';
                    localStorage.setItem('zeus.webui.theme', theme);
                }
                colors.accent = localStorage.getItem('zeus.webui.custom_color') || '';
                colors.sidebar = localStorage.getItem('zeus.webui.custom_sidebar_color') || '';
                colors.background = localStorage.getItem('zeus.webui.custom_background_color') || '';
                colors.foreground = localStorage.getItem('zeus.webui.custom_foreground_color') || '';
            } catch (error) {
                console.warn('[WEBUI] Could not read appearance preference during startup:', error);
            }
            if (!['light', 'dark', 'system'].includes(theme)) theme = 'system';
            const mode = theme === 'system'
                ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
                : theme;
            const defaults = mode === 'dark'
                ? { accent: '#1d4ed8', sidebar: '#191919', background: '#000000', foreground: '#ededed' }
                : { accent: '#1d4ed8', sidebar: '#ffffff', background: '#f5f5f5', foreground: '#222222' };
            const validHex = value => /^#(?:[0-9a-f]{3}|[0-9a-f]{4}|[0-9a-f]{6}|[0-9a-f]{8})$/i.test(value);
            document.documentElement.dataset.themeMode = mode;
            for (const name of Object.keys(defaults)) {
                const color = validHex(colors[name] || '') ? colors[name] : defaults[name];
                document.documentElement.style.setProperty(`--user-${name}`, color);
            }
            document.querySelector('meta[name="theme-color"]').content = validHex(colors.background || '')
                ? colors.background
                : defaults.background;
        })();
    </script>
    <style>
        html {
            color-scheme: dark;
            background: #000000;
        }

        body {
            min-height: 100vh;
            margin: 0;
            background: #000000;
            color: #edf0f7;
        }
        html[data-theme-mode="light"], html[data-theme-mode="light"] body {
            color-scheme: light;
            background: #f5f5f5;
            color: #222222;
        }
        html[data-theme-mode="dark"], html[data-theme-mode="dark"] body {
            color-scheme: dark;
            background: #000000;
            color: #ededed;
        }
    </style>
    <script src="/js/theme.js"></script>
    <link rel="stylesheet" href="/vendor/katex/katex.min.css">
    <script defer src="/vendor/markdown-it/markdown-it.min.js"></script>
    <script defer src="/vendor/task-lists/markdown-it-task-lists.min.js"></script>
    <script defer src="/vendor/katex/katex.min.js"></script>
    <script defer src="/vendor/dompurify/purify.min.js"></script>
</head>

<body>
    <script>
        document.body.dataset.themeMode = document.documentElement.dataset.themeMode;
        for (const name of ['accent', 'sidebar', 'background', 'foreground']) {
            document.body.style.setProperty(
                `--user-${name}`,
                document.documentElement.style.getPropertyValue(`--user-${name}`),
            );
        }
    </script>
    <div class="app" id="app">
        <aside class="sidebar" id="conversation-menu">
            <div class="menubar">
                <button class="menubar-brand" id="menubar-brand" type="button" title="Reload ZEUS"
                    aria-label="Reload ZEUS">
                    <img src="/ZEUSbanner.png" alt="ZEUS">
                </button>
                <button class="menu-toggle" id="menu-toggle" type="button" aria-label="Collapse menu"
                    aria-expanded="true" aria-controls="sidebar-content">
                    <img src="/icon/sidebar.png" width="16" height="16" alt="Sidebar" class="sidebar-icon">
                </button>
            </div>
            <!-- Collapsed-sidebar quick icons (visible only when sidebar is closed) -->
            <div class="sidebar-collapsed-icons" id="sidebar-collapsed-icons">
                <button class="collapsed-icon-btn" id="collapsed-new-chat" type="button" title="New chat"
                    aria-label="New chat">
                    <img src="/icon/newchat.png" width="16" height="16" alt="New chat" class="collapsed-icon-img">
                </button>
                <button class="collapsed-icon-btn" id="collapsed-search" type="button" title="Search something..."
                    aria-label="Search conversations">
                    <img src="/icon/search.png" width="15" height="15" alt="Search" class="collapsed-icon-img">
                </button>
            </div>
            <div class="sidebar-content" id="sidebar-content">
                <div class="sidebar-quick-actions">
                    <button class="new-chat" id="new-chat" type="button" title="New chat">
                        <img src="/icon/newchat.png" width="15" height="15" alt="" class="newchat-icon">
                        <span>New chat</span>
                    </button>
                    <button class="sidebar-search-btn" id="sidebar-search-btn" type="button"
                        title="Search conversations">
                        <img src="/icon/search.png" width="13" height="13" alt="" class="search-btn-icon">
                        <span>Search</span>
                    </button>
                </div>
                <section class="conversation-section" id="pinned-section" hidden>
                    <button class="side-label" id="pinned-toggle" type="button" aria-expanded="true"
                        aria-controls="pinned-list">
                        <span>Pinned</span>
                        <svg class="conversation-toggle-icon" width="14" height="14" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                            <path d="m6 9 6 6 6-6" />
                        </svg>
                    </button>
                    <div class="conversation-list" id="pinned-list"></div>
                </section>
                <section class="conversation-section">
                    <button class="side-label" id="conversation-toggle" type="button" aria-expanded="true"
                        aria-controls="conversation-list">
                        <span id="conversation-label">All</span>
                        <svg class="conversation-toggle-icon" width="14" height="14" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                            <path d="m6 9 6 6 6-6" />
                        </svg>
                    </button>
                    <div class="conversation-list" id="conversation-list">
                        <div class="conversation-empty">Loading conversations…</div>
                    </div>
                </section>
            </div>
            <button class="sidebar-settings-button" id="settings-open-button" type="button"
                title="Settings" aria-label="Open settings">
                <img src="/icon/settings.png" width="18" height="18" alt="">
            </button>
        </aside>
        <main class="main">
            <section class="chat welcome-state">
                <div class="chat-actions" id="chat-actions">
                    <button class="temp-chat-button" id="temp-chat-button" type="button"
                        title="Temporary chat" aria-label="Temporary chat" aria-pressed="false">
                        <img src="/icon/tempchat.png" width="16" height="16" alt="" class="temp-chat-icon">
                    </button>
                    <button class="chat-more-button" id="chat-more-button" type="button"
                        title="Conversation options" aria-label="Conversation options" aria-expanded="false" hidden>
                        <img src="/icon/dots.png" width="18" height="18" alt="">
                    </button>
                    <div class="conversation-menu chat-menu" id="active-chat-menu" hidden></div>
                </div>
                <div class="chat-scroll" id="chat-scroll">
                    <div class="chat-content">
                        <div class="history-loading" id="history-loading" role="status" aria-live="polite"></div>
                        <div class="welcome-stage" id="welcome-stage">
                            <div class="welcome" id="welcome" hidden>
                                <h2 id="welcome-text">Howdy, wanna talk something?</h2>
                                <p id="welcome-subtitle" hidden>This chat still can use tools, skill,... but will not save any data</p>
                            </div>
                            <div class="composer-wrap" id="composer-wrap">
                                <form class="composer" id="chat-form">
                                    <div class="tool-picker-menu" id="tool-picker-menu" role="listbox"
                                        aria-label="Available tools" hidden></div>
                                    <div class="prompt-add-menu" id="prompt-add-menu" role="menu"
                                        aria-label="Add to prompt" hidden>
                                        <button class="prompt-add-option" id="add-files-option" type="button"
                                            role="menuitem">
                                            <img src="/icon/attach.png" width="16" height="16" alt="">
                                            <span class="prompt-add-option-copy">
                                                <span class="prompt-add-option-label">Attach images and files</span>
                                                <span class="prompt-add-option-description">Choose files to add to your prompt</span>
                                            </span>
                                        </button>
                                        <button class="prompt-add-option" type="button" role="menuitem">
                                            <img src="/icon/picture.png" width="16" height="16" alt="">
                                            <span class="prompt-add-option-copy">
                                                <span class="prompt-add-option-label">Create image</span>
                                                <span class="prompt-add-option-description">Generate an image from a description</span>
                                            </span>
                                        </button>
                                        <button class="prompt-add-option" id="add-search-option" type="button"
                                            role="menuitem">
                                            <img src="/icon/search.png" width="16" height="16" alt="">
                                            <span class="prompt-add-option-copy">
                                                <span class="prompt-add-option-label">Search on the internet</span>
                                                <span class="prompt-add-option-description">Find current information and sources on the web</span>
                                            </span>
                                        </button>
                                        <button class="prompt-add-option" type="button" role="menuitem">
                                            <img src="/icon/deep-research.png" width="16" height="16" alt="">
                                            <span class="prompt-add-option-copy">
                                                <span class="prompt-add-option-label">Deep research</span>
                                                <span class="prompt-add-option-description">Explore a topic in depth across multiple sources</span>
                                            </span>
                                        </button>
                                    </div>
                                    <div class="prompt-attachments" id="prompt-attachments"
                                        aria-label="Attached files"></div>
                                    <div class="prompt-input-wrap" id="prompt-input-wrap">
                                        <button class="prompt-add-button" id="prompt-add-button" type="button"
                                            aria-label="Add to prompt" title="Add to prompt" aria-expanded="false"
                                            aria-controls="prompt-add-menu">
                                            <img src="/icon/add.png" width="17" height="17" alt="">
                                        </button>
                                        <div class="selected-tools" id="selected-tools" hidden></div>
                                        <textarea id="message-input" rows="1" placeholder="Ask something..." spellcheck="false"
                                            aria-label="Message" aria-controls="tool-picker-menu"
                                            aria-expanded="false" autocomplete="off"></textarea>
                                        <div class="prompt-scrollbar" id="prompt-scrollbar" role="scrollbar"
                                            aria-label="Prompt scroll position" aria-controls="message-input"
                                            aria-orientation="vertical" aria-valuemin="0" aria-valuemax="1000"
                                            aria-valuenow="0" tabindex="-1">
                                            <span class="prompt-scrollbar-thumb" id="prompt-scrollbar-thumb"></span>
                                        </div>
                                    </div>
                                    <input id="prompt-files-input" type="file"
                                        accept="image/*,.txt,.md,.markdown,.rst,.csv,.tsv,.json,.jsonl,.yaml,.yml,.toml,.xml,.html,.htm,.css,.js,.mjs,.cjs,.ts,.tsx,.jsx,.py,.pyi,.java,.c,.h,.cc,.cpp,.hpp,.rs,.go,.rb,.php,.sh,.bash,.zsh,.sql,.ps1,.bat,.cmd,.diff,.patch,.ini,.conf,.env,.log,.ipynb,.mdx,.vue,.svelte,.astro,.kt,.kts,.swift,.dart,.scala,.sc,.pl,.pm,.lua,.r,.m,.mm,.tex,.adoc,.asciidoc,.lock,.tf,.hcl,.proto,.graphql,.gql,.sol,.ex,.exs,.erl,.hrl,.hs,.lhs,.elm,.clj,.cljs,.edn,.fs,.fsx,.cs,.csx,.vb,.nix,.fish,.make,.mk,.gitignore,.gitattributes,.editorconfig"
                                        multiple hidden>
                                    <div class="composer-actions">
                                        <div class="model-picker" id="model-picker">
                                            <button class="model-picker-button" id="model-picker-button" type="button"
                                                aria-expanded="false" aria-controls="model-picker-menu">
                                                <span class="model-picker-label" id="model-picker-label">Checking
                                                    model…</span>
                                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none"
                                                    stroke="currentColor" stroke-width="2">
                                                    <path d="m6 15 6-6 6 6" />
                                                </svg>
                                            </button>
                                            <div class="model-picker-menu" id="model-picker-menu" hidden></div>
                                        </div>
                                        <button class="thinking-mode-button" id="thinking-mode-button" type="button"
                                            title="Thinking mode: Auto (Click to switch: Auto / On / Off)"
                                            aria-label="Thinking mode">
                                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
                                                stroke="currentColor" stroke-width="1.8">
                                                <path
                                                    d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 4.44-2.54z" />
                                                <path
                                                    d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-4.44-2.54z" />
                                            </svg>
                                            <span id="thinking-mode-label">Think: Auto</span>
                                        </button>
                                        <button class="send" id="send-button" type="submit" aria-label="Send message"
                                            title="Send message" disabled>
                                            <img src="/icon/send.png" width="16" height="16" alt="Send"
                                                class="send-icon">
                                        </button>
                                    </div>
                                </form>
                            </div>
                            <div class="footer" id="chat-footer"></div>
                        </div>
                        <div class="messages" id="messages" aria-live="polite"></div>
                    </div>
                </div>
                <div class="chat-scrollbar" id="chat-scrollbar" role="scrollbar" tabindex="0"
                    aria-label="Chat page scroll" aria-controls="chat-scroll" aria-orientation="vertical"
                    aria-valuemin="0" aria-valuemax="1000" aria-valuenow="0">
                    <div class="chat-scrollbar-thumb" id="chat-scrollbar-thumb"></div>
                </div>
                <div class="chat-dock" id="chat-dock" hidden></div>
            </section>
        </main>
    </div>
    <dialog class="delete-dialog" id="delete-dialog" aria-labelledby="delete-dialog-title">
        <form method="dialog">
            <h2 id="delete-dialog-title">Delete conversation?</h2>
            <p>Are you sure you want to permanently delete <strong id="delete-chat-title"></strong> and all its
                messages? This can't be undone.</p>
            <div class="delete-dialog-actions">
                <button class="dialog-cancel" type="submit" value="cancel">Cancel</button>
                <button class="dialog-delete" type="submit" value="delete">Delete conversation</button>
            </div>
        </form>
    </dialog>
    <!-- Search modal -->
    <div class="search-overlay" id="search-overlay" hidden aria-modal="true" role="dialog"
        aria-label="Search conversations">
        <div class="search-modal" id="search-modal">
            <div class="search-modal-header">
                <img src="/icon/search.png" width="14" height="14" alt="" class="search-modal-icon">
                <input class="search-modal-input" id="search-modal-input" type="search"
                    placeholder="Search conversations…" autocomplete="off" spellcheck="false"
                    aria-label="Search conversations">
                <button class="search-modal-close" id="search-modal-close" type="button" aria-label="Close search">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6 6 18M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <div class="search-results" id="search-results"></div>
        </div>
    </div>
    <script type="module" src="/js/chat.js"></script>
</body>

</html>
