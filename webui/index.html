<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b0e14">
    <title>ZEUS</title>
    <link rel="icon" href="/zeus.ico" sizes="any">
    <style>
        html { color-scheme: dark; background: #0b0e14; }
        body { min-height: 100vh; margin: 0; background: #0b0e14; color: #edf0f7; }
    </style>
    <script src="/js/theme.js"></script>
</head>
<body>
    <div class="app" id="app">
        <aside class="sidebar" id="conversation-menu">
            <div class="menubar">
                <span class="menubar-brand">ZEUS</span>
                <button class="menu-toggle" id="menu-toggle" type="button" aria-label="Collapse menu" aria-expanded="true" aria-controls="sidebar-content">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
            </div>
            <div class="sidebar-content" id="sidebar-content">
                <button class="new-chat" id="new-chat" type="button">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>
                    New chat
                </button>
                <section class="conversation-section">
                    <button class="side-label" id="conversation-toggle" type="button" aria-expanded="true" aria-controls="conversation-list">
                        <span id="conversation-label">All</span>
                        <svg class="conversation-toggle-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
                    </button>
                    <div class="conversation-list" id="conversation-list"><div class="conversation-empty">Loading conversations…</div></div>
                </section>
            </div>
        </aside>
        <main class="main">
            <section class="chat welcome-state">
                <div class="chat-scroll" id="chat-scroll">
                    <div class="chat-content">
                        <div class="history-loading" id="history-loading" role="status" aria-live="polite"></div>
                        <div class="welcome-stage" id="welcome-stage">
                            <div class="welcome" id="welcome" hidden>
                                <h2>Howdy, wanna talk something?</h2>
                            </div>
                            <div class="composer-wrap" id="composer-wrap">
                                <form class="composer" id="chat-form">
                                    <textarea id="message-input" rows="1" maxlength="8000" placeholder="Ask something..." aria-label="Message"></textarea>
                                    <div class="composer-actions">
                                        <div class="model-picker" id="model-picker">
                                            <button class="model-picker-button" id="model-picker-button" type="button" aria-expanded="false" aria-controls="model-picker-menu">
                                                <span class="model-picker-label" id="model-picker-label">Checking model…</span>
                                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 15 6-6 6 6"/></svg>
                                            </button>
                                            <div class="model-picker-menu" id="model-picker-menu" hidden></div>
                                        </div>
                                        <button class="send" id="send-button" type="submit" aria-label="Send message" title="Send message" disabled>
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5m-7 7 7-7 7 7"/></svg>
                                        </button>
                                    </div>
                                </form>
                            </div>
                            <div class="footer" id="chat-footer"></div>
                        </div>
                        <div class="messages" id="messages" aria-live="polite"></div>
                    </div>
                </div>
                <div class="chat-dock" id="chat-dock" hidden></div>
            </section>
        </main>
    </div>
    <dialog class="delete-dialog" id="delete-dialog" aria-labelledby="delete-dialog-title">
        <form method="dialog">
            <h2 id="delete-dialog-title">Delete conversation?</h2>
            <p>Are you sure you want to permanently delete <strong id="delete-chat-title"></strong> and all its messages? This can't be undone.</p>
            <div class="delete-dialog-actions">
                <button class="dialog-cancel" type="submit" value="cancel">Cancel</button>
                <button class="dialog-delete" type="submit" value="delete">Delete conversation</button>
            </div>
        </form>
    </dialog>
    <script type="module" src="/js/chat.js"></script>
</body>
</html>
